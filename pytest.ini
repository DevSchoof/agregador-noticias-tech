[pytest]
# Testes E2E (navegador de verdade) ficam separados dos rápidos:
#   pytest          -> só os rápidos (sem navegador, sem internet)
#   pytest -m e2e   -> só os E2E com Selenium
# O -m da linha de comando substitui o daqui.
addopts = -m "not e2e" --strict-markers
markers =
    e2e: teste de ponta a ponta com navegador (Selenium); rode com pytest -m e2e
